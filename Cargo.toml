[package]
name = "fast_meta"
version = "2.0.0"
edition = "2021"

[dependencies]
memmap2 = "0.9"
serde_json = "1.0"
flate2 = { version = "1.0", default-features = false }
crc32fast = "1.5"
memchr = "2.7"

[features]
default = ["zlib-ng"]
zlib-ng = ["flate2/zlib-ng"]
portable-zlib = ["flate2/rust_backend"]

[profile.release]
lto = true
codegen-units = 1
strip = true
